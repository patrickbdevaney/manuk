name: mcp-artifact

# SHIP.2: manuk-mcp release ARTIFACTS. Manual dispatch only; it builds, packages and verifies. It never tags,
# never creates a GitHub release and never uploads to a registry: the owner approves the tag.
# Linux x86_64 and macOS arm64. Each artifact ships with a CycloneDX 1.5 SBOM and a sha256 file.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_NET_RETRY: 10

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04, not ubuntu-latest: a binary built on a newer glibc needs GLIBC_2.43 and will not start
          # in the clean ubuntu:24.04 verify container (glibc 2.39). tests/sprint/test_ship2.sh pins that bound.
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, name: manuk-mcp-linux-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: manuk-mcp-macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
      - name: fetch pinned SpiderMonkey (sha256 pin; exports MOZJS_ARCHIVE)
        shell: bash
        run: MOZJS_TRIPLE=${{ matrix.target }} ./scripts/mozjs-fetch.sh
      - name: tools
        run: cargo install cargo-cyclonedx cargo-auditable --locked
      - name: build (cargo auditable embeds the dependency list in the binary)
        run: cargo auditable build --release -p manuk-mcp --target ${{ matrix.target }}
      - name: package + SBOM + sha256
        run: scripts/mcp-package.sh target/${{ matrix.target }}/release/manuk-mcp ${{ matrix.name }} dist
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.name }}", path: dist/* }

  # A CLEAN container: nothing but the distro, the downloaded artifact, the installer and the pinned Chrome.
  # Two levels: this host step only relaxes the kernel's unprivileged-userns restriction (a read-only /proc/sys in a
  # container cannot), so Chrome's sandbox can start; the verify itself runs in a fresh ubuntu:24.04 container.
  verify-linux:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { name: manuk-mcp-linux-x86_64, path: rel }
      - uses: actions/checkout@v4   # only for scripts/ (installer, smoke, verify) and the pin; no build happens here
        with: { path: src }
      - name: 'host: allow the unprivileged user namespaces Chrome sandbox needs (CI VM only)'
        run: |
          echo "before: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo n/a)"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: 'clean ubuntu:24.04 container: checksum, install, claude mcp add, smoke (sandbox on)'
        run: |
          docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -v "$GITHUB_WORKSPACE:/w" -w /w ubuntu:24.04 sh src/scripts/mcp-verify-clean.sh
