# Manuk — a browser engine, from first principles in Rust.
# Workspace root. See CLAUDE.md for the governing directive (scope, architecture,
# and the JS-engine modification boundary that must not be crossed without sign-off).
#
# Phase: human-operator GUI browser only. The engine core (net/html/dom/css/
# layout/js/text) is kept free of GUI-only assumptions so the eventual headless
# split diverges only at the paint/compositor layer.

[workspace]
resolver = "2"
members = [
    "demo",
    "engine/net",
    "engine/dom",
    "engine/a11y",
    "engine/html",
    "engine/css",
    "engine/layout",
    "engine/text",
    "engine/media",
    "engine/js",
    "engine/paint",
    "engine/compositor",
    "engine/page",
    "shell",
    "agent",
    "bidi",
    "store",
    "tests/wpt",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MPL-2.0"
repository = "https://example.invalid/manuk"

# Central version pinning so every crate agrees. Reuse mature components per the
# CLAUDE.md stack table; build-from-scratch layers depend only on these.
[workspace.dependencies]
# --- shared infra ---
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
url = "2"
smallvec = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
async-trait = "0.1"

# --- networking (Reuse) ---
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "webpki-roots", "tls12"] }
http = "1"
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
rustls-pki-types = "1"
# Streaming body decode (Content-Encoding) — feature-gated, pulls only what we use.
async-compression = { version = "0.4", default-features = false, features = ["tokio", "gzip", "brotli", "deflate", "zlib"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false }

# --- charset (Reuse: WHATWG Encoding Standard, Gecko's own) ---
encoding_rs = "0.8"
chardetng = "0.1"

# --- HTML parsing (Reuse) ---
html5ever = "0.39"
# The XML tree builder. Same authors, same version train and — decisively — the SAME
# `markup5ever::TreeSink` trait html5ever drives, so `ArenaSink` backs both parsers unchanged.
xml5ever = "0.39"
markup5ever_rcdom = "0.39"
tendril = "0.4"

# --- CSS (Reuse target: Stylo; feature-gated). Fallback cascade uses cssparser. ---
cssparser = "0.34"

# --- layout (Reuse + build) ---
taffy = "0.12"

# --- text (Reuse) ---
fontdb = "0.23"
fontdue = "0.9"

# --- paint / raster ---
tiny-skia = "0.12"

# --- GPU / windowing (Reuse) ---
wgpu = "27"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
raw-window-handle = "0.6"

# --- internal crates ---
manuk-net = { path = "engine/net" }
manuk-dom = { path = "engine/dom" }
manuk-a11y = { path = "engine/a11y" }
manuk-agent = { path = "agent" }
manuk-html = { path = "engine/html" }
manuk-css = { path = "engine/css" }
manuk-layout = { path = "engine/layout" }
manuk-text = { path = "engine/text" }
# `default-features = false` belongs HERE, not on the member. Cargo IGNORES a member's
# `default-features` for a `workspace = true` dependency unless the workspace declaration states it
# too (it warns, and warns that it may become a hard error). engine/js said it and got nothing.
# Today `manuk-media`'s `default` is empty so the decoder stays out regardless — but that made the
# member's line read as a guard that was never load-bearing. Stated at the level cargo enforces.
manuk-media = { path = "engine/media", default-features = false }
manuk-js = { path = "engine/js" }
manuk-paint = { path = "engine/paint" }
manuk-compositor = { path = "engine/compositor" }
manuk-page = { path = "engine/page" }

# Performance targets (CLAUDE.md § Performance targets):
# static linking + LTO + stripped symbols.
# musl (Linux) / static-CRT (Windows) are selected per-target in .cargo/config.toml
# and are NOT forced here so the default host build stays simple.
[profile.release]
opt-level = "s"     # size-biased; binary-size is a first-class target
lto = true
codegen-units = 1
# **`panic = "abort"` was here, and it made Bar 0 impossible by construction.**
#
# With abort, `catch_unwind` cannot exist: ANY panic anywhere — one missing style entry on one
# element of one page — kills the browser and everything the user had open. apple.com produced a core
# dump exactly this way. Fixing that specific panic was prevention of one instance; METHODOLOGY Part
# 23.2 asks for CONTAINMENT of the class, because you will not prevent every crash-class bug before
# Bar 1 and pretending otherwise is how a browser ships that dies on one bad page.
#
# Unwinding buys the supervised per-navigation boundary (`G_CONTAIN`): a panic in parse/cascade/
# layout/paint closes or reloads THAT page, and the browser — and every other tab — carries on. The
# cost is a slightly larger binary and landing-pad codegen. Binary size is a first-class target here;
# not crashing is a zeroth-class one.
panic = "unwind"
strip = true

# A dev profile that still builds the heavy dependency graph quickly.
[profile.dev]
opt-level = 0

# ── DEBUGINFO IS THE DISK (observer, tick 264). /home hit 93% with 78.3G in 290 test binaries.
# Measured on a 552MB gate binary: .debug_info 166MB + .debug_abbrev 2.3MB + .debug_aranges 6.9MB
# = ~175MB of pure DWARF per binary. And it is NOT prunable orphan mass — 290 bins across 146 stems
# is 2.0 per stem, i.e. exactly the two live feature variants (spidermonkey / stylo,spidermonkey)
# that verify.sh builds. There is nothing stale to reclaim; the working set is simply that big.
#
# We want LINE TABLES ONLY: `.debug_line` is kept, so panics and Bar-0 backtraces still report
# file:line — which is the debug information this project actually uses, given every crash is
# triaged from a backtrace and a repro page. Full `.debug_info` (types, locals, expressions) only
# pays off under an interactive debugger, which is not how this loop works.
#
# ── CORRECTION (agent, tick 1257). `debug = 1` DOES NOT emit line tables only. Cargo's `1` is
# rustc's `-Cdebuginfo=limited`: line tables PLUS a DIE tree for functions and types (everything
# except variables). `debug = "line-tables-only"` is the setting the comment above describes, and
# the difference is most of the binary. MEASURED with `size -A` on a live 246MB gate binary
# (`g_runaway`, stylo+spidermonkey) built under `debug = 1`:
#
#     .debug_str      97.0 MB      .debug_ranges    6.4 MB
#     .text           49.5 MB      .debug_aranges   4.6 MB
#     .debug_line     29.0 MB      .debug_abbrev    0.6 MB
#     .rodata         21.6 MB      ────────────────────────
#     .debug_info     19.7 MB      DWARF total    157.3 MB  = 64% of the binary
#
# `.debug_info`/`.debug_str`/`.debug_ranges`/`.debug_aranges` are exactly what `limited` adds over
# `line-tables-only`, and `.debug_str` alone is larger than `.text`. This is not a capability trade:
# `line-tables-only` is DEFINED as the subset that keeps file:line in a backtrace.
#
# WHY IT IS URGENT: `verify.sh`'s `js` gate has no `--test` filter, so cargo builds EVERY
# `engine/page/tests/*.rs` target (472 of them, one per gate, growing by one per tick — the ratchet's
# own unpriced disk constant) before running one. At ~249MB each that is ~117.5GB against ~121GB
# free, and `disk-hygiene.sh` destructively purges `target/debug` at 95%: the cold build crosses the
# threshold, gets purged, and rebuilds cold forever. t1256 needed 7 wall runs; t1257 took 12 and
# never converged, every red gate reading BUILD FAILED on a different binary. Three independent runs
# measured the shortfall at ~18 binaries (run 12 reached 454 of 472 at 145MB free).
#
# AND `split-debuginfo = "unpacked"` MOVES THE REST OF THE DWARF OUT OF THE BINARY, which matters
# far more here than in a normal workspace: 472 test binaries each statically link the SAME dependency
# graph, so every byte of a dep's `.debug_info`/`.debug_str` was being copied 472 times. Unpacked
# leaves it in per-crate `.dwo` files that are written ONCE and shared. `.debug_line` STAYS IN THE
# BINARY, which is why file:line survives — verified, not assumed (below).
#
# MEASURED, same gate, same hour, three builds of `g_runaway` (stylo+spidermonkey):
#
#     debug = 1                                        275.0 MB    ×472 ≈ 130 GB   ← the deadlock
#     debug = "line-tables-only"                       204.2 MB    ×472 ≈  96 GB
#     + split-debuginfo = "unpacked"                   172.1 MB    ×472 ≈  81 GB   ← 37.5% off
#                                                      (+2.1 MB of .dwo for the leaf crate)
#
# FALSIFIABLE CHECK, RUN: a deliberate `index out of bounds` in a temporary `engine/page/tests`
# target, `RUST_BACKTRACE=1`, under the final profile — the backtrace still resolves
# `at ./tests/zz_bt_probe.rs:4:14`, and `.debug_line` measures 29.0 MB in the 172 MB binary (i.e.
# the line tables for EVERY linked crate, not just the leaf). No capability is traded for the space.
debug = "line-tables-only"
split-debuginfo = "unpacked"
