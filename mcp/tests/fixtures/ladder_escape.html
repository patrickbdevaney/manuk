<!doctype html><html><head><title>Ladder escape</title><style>body{margin:0}
#m{position:fixed;left:0;top:0;width:100%;height:60px;background:#ddd;z-index:99}</style></head><body>
<h1>Ladder escape</h1>
<div id="m" role="menu"><div role="menuitem" tabindex="0" id="mi">Menu entry</div></div>
<button id="go" style="position:fixed;left:10px;top:10px">Go</button>
<h2 id="out" style="margin-top:100px">idle</h2>
<script>
document.getElementById('go').addEventListener('click',function(){document.getElementById('out').textContent='went';});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){var m=document.getElementById('m');if(m)m.remove();}});
</script></body></html>
