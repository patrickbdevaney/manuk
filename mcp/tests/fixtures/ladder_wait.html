<!doctype html><html><head><title>Ladder wait</title><style>body{margin:0}
#cover{display:none;position:fixed;left:0;top:0;width:100%;height:100%;background:#eee;z-index:99}
#cover.on{display:block;animation:gone 1.6s steps(1,end) forwards}
@keyframes gone{from{display:block}to{display:none}}</style></head><body>
<h1>Ladder wait</h1>
<button id="arm">Arm</button>
<button id="go">Go</button>
<div id="cover">Loading...</div>
<h2 id="out">idle</h2>
<script>
document.getElementById('go').addEventListener('click',function(){document.getElementById('out').textContent='went';});
document.getElementById('arm').addEventListener('click',function(){document.getElementById('cover').className='on';});
</script></body></html>
