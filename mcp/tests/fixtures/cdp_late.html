<!doctype html><html><head><title>Late</title><style>body{margin:0}
#cover{position:fixed;left:0;top:0;width:100%;height:100%;background:#eee;z-index:99}</style></head><body>
<h1>Late page</h1>
<button id="pay">Pay now</button>
<button id="save">Save</button>
<h2 id="out">idle</h2>
<script>
document.getElementById('pay').addEventListener('click',function(){document.getElementById('out').textContent='paid';});
document.getElementById('save').addEventListener('click',function(){document.getElementById('out').textContent='saved-old';});
setTimeout(function(){
  // re-render: the Save button is replaced by an equivalent one
  var o=document.getElementById('save'),n=o.cloneNode(true);
  n.addEventListener('click',function(){document.getElementById('out').textContent='saved-new';});
  o.replaceWith(n);
  // and an overlay lands on top of everything (Pay now)
  var c=document.createElement('div');c.id='cover';c.textContent='Cookie wall';document.body.appendChild(c);
},1800);
</script></body></html>
