<!doctype html><html><head><title>Popover</title></head><body>
<div id="bg"><h1>Calendar</h1><button id="more">+3 more</button><button id="open">Event</button></div>
<script>
document.getElementById('open').addEventListener('click', function () {
  document.getElementById('bg').setAttribute('aria-hidden', 'true');
  var d = document.createElement('div');
  d.style.cssText = 'position:absolute;top:40px;left:40px;width:200px;height:120px;background:#fff';
  d.innerHTML = '<p>Team sync</p><button id="x">Close</button><button>Edit</button>';
  document.body.appendChild(d);
});
</script></body></html>
