<!doctype html><html><head><title>Modal</title><style>
#dlg{position:absolute;left:0;top:0;width:400px;height:300px;background:#fff;z-index:50}
</style></head><body>
<h1>Modal page</h1>
<button id="buy">Buy now</button>
<input id="name" type="text" value="">
<div id="dlg" role="dialog" aria-label="Sign up dialog"><button id="close">Dismiss</button></div>
<h2 id="out" aria-label="idle">status</h2>
<script>
document.getElementById('buy').addEventListener('click', function(){ document.getElementById('out').setAttribute('aria-label','bought'); });
document.getElementById('close').addEventListener('click', function(){ document.getElementById('dlg').remove(); });
</script></body></html>
