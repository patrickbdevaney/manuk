<!DOCTYPE html><meta charset=utf-8><title>probe2</title>
<script src="/resources/testharness.js"></script><script src="/resources/testharnessreport.js"></script>
<style>.t{transition:all 2s linear;position:absolute;top:0;left:0}
.a{background-color:rgb(255,0,0);padding-left:10px;opacity:1}
.b{background-color:rgb(0,0,255);padding-left:50px;opacity:0.2}</style>
<div id=log></div><div id=host></div>
<script>
const cs=(e,p)=>getComputedStyle(e).getPropertyValue(p);
for(const p of ['background-color','padding-left','opacity']){
 async_test(function(t){
  const e=document.createElement('div');e.className='t a';e.textContent='x';
  document.getElementById('host').appendChild(e);
  let ended=null;
  e.addEventListener('transitionend',ev=>ended=ev.propertyName+":"+ev.elapsedTime);
  const from=cs(e,p);
  e.className='t b';
  const nDoc=document.getAnimations().length;
  const a0=cs(e,p);
  setTimeout(()=>{const mid=cs(e,p);
   setTimeout(()=>{const end=cs(e,p);
    t.step(()=>assert_equals("REALTIME "+p+" from="+JSON.stringify(from)+" t0="+JSON.stringify(a0)+" mid(1s)="+JSON.stringify(mid)+" end(2.6s)="+JSON.stringify(end)+" transitionend="+ended+" nDocAnims="+nDocAnimsAt0(nDoc),""));
    t.done();},1600);},1000);
 },"rt-"+p);
}
function nDocAnimsAt0(n){return n}
// control: Element.animate, known-to-start
async_test(function(t){
 const e=document.createElement('div');document.getElementById('host').appendChild(e);
 const a=e.animate([{opacity:1},{opacity:0.2}],{duration:2000,easing:'linear'});
 a.currentTime=1000;
 t.step(()=>assert_equals("CONTROL element.animate mid opacity="+cs(e,'opacity')+" nDocAnims="+document.getAnimations().length,""));t.done();
},"control-animate");
</script>
