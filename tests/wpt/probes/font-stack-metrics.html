<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; border:0; }
  body { font-size:16px; }
  /* Three declarations: an EXPLICIT face we know is installed, the generic stacks a real
     site uses, and the exact stack blog.rust-lang.org's table uses. If the explicit face
     matches Chrome and the generic ones do not, the divergence is SELECTION, not COMPUTATION. */
  #explicit { font-family:"DejaVu Sans"; }
  #sans     { font-family:sans-serif; }
  #serif    { font-family:serif; }
  #mono     { font-family:monospace; }
  #stack    { font-family:"Fira Sans",Helvetica,Arial,sans-serif; }
  span { display:inline-block; }
</style></head><body>
<div><span id="explicit">Announcing Rust 1.90.0 and the metrics probe</span></div>
<div><span id="sans">Announcing Rust 1.90.0 and the metrics probe</span></div>
<div><span id="serif">Announcing Rust 1.90.0 and the metrics probe</span></div>
<div><span id="mono">Announcing Rust 1.90.0 and the metrics probe</span></div>
<div><span id="stack">Announcing Rust 1.90.0 and the metrics probe</span></div>
</body></html>
