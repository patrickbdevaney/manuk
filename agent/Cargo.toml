[package]
name = "manuk-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Headless agentic browser: a page driver + inference-backend-agnostic agent loop. Agent logic is decoupled from both the harness and the LLM backend."

[lib]
path = "src/lib.rs"

# Committed runner: drives the agent with a SINGLE GROQ_API_KEY.
[[bin]]
name = "agent-run"
path = "src/bin/agent-run.rs"

# INFERENCE.MD §2 acceptance gate: the four capabilities against a local llama-server.
[[bin]]
name = "agent-local-suite"
path = "src/bin/agent-local-suite.rs"

# AG5: measure the in-process agent advantage vs a CDP-over-socket baseline.
[[bin]]
name = "ag5-latency"
path = "src/bin/ag5-latency.rs"

[[bin]]
name = "a11y-dump"
path = "src/bin/a11y-dump.rs"

# The versioned instrument for Track B's ">=90% node match" bar — precision AND recall, not
# whichever half a throwaway script happened to compute.
[[bin]]
name = "a11y-score"
path = "src/bin/a11y-score.rs"

# Of the targets an agent can PERCEIVE on a real page, how many can it ACT on?
[[bin]]
name = "drive-probe"
path = "src/bin/drive-probe.rs"

[dependencies]
# ⭐⭐⭐ **THE AGENT'S BROWSER HAD NO JAVASCRIPT AND NOT THE REAL CASCADE.** `manuk-page`'s `stylo`
# and `spidermonkey` features are opt-in, and this line took neither — so `AgentBrowser` cascaded
# with `MinimalCascade` and never executed a page script. Every `agent/tests/` fixture and both
# corpus instruments (`a11y-score`, `drive-probe`) were measuring a static-HTML browser.
manuk-page = { workspace = true, features = ["spidermonkey"] }
manuk-a11y.workspace = true
manuk-dom.workspace = true
manuk-html.workspace = true
manuk-paint.workspace = true
manuk-net.workspace = true
manuk-text.workspace = true

anyhow.workspace = true
url.workspace = true
tracing.workspace = true
tokio.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
async-trait.workspace = true
futures-util = { workspace = true, features = ["std"] }
tracing-subscriber.workspace = true
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

# ── DEV-ONLY. `g_a11y_generated_name_entry` composes exactly what `host_ax_role_name` composes —
# `manuk_layout::generated_text(dom, styles)` handed to `manuk_a11y::accessible_name_generated` — so
# the gate proves the COMPOSITION the binding performs rather than restating one half of it.
[dev-dependencies]
manuk-layout.workspace = true
